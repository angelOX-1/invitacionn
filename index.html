    <script>

        let intentos = 0;

        const mensajes = [
            "ACEPTA LESBIANA",
            "VAMOS, SÉ QUE QUIERES",
            "DALE QUE SÍ",
            "ACEPTA ALEEEE",
            "RENEGONA",
            "BOXEADORA",
            "GOLPEADORA",
            "PELUDА",
            "DALE",
            "QUE",
            "SIIII",
            "Y TE DEJO PEGARME",
            "ME PATEAS EN EL PILÍN",
            "TE DOY A MANDARINO",
            "TE ODIO",
            "TE ODIOOOOOO",
            "YA NO CLICKES NADA",
            "YA SÁLTE DE LA PÁGINA",
            "VETE",
            "YA..."
        ];

        const submensajes = Array(mensajes.length).fill("");

        const botones = [
            "✕ NO QUIERO"
        ];


        function rechazar() {

            intentos++;

            const tarjeta =
                document.getElementById("tarjeta");

            const boton =
                document.getElementById("noQuiero");

            const pregunta =
                document.getElementById("pregunta");

            const submensaje =
                document.getElementById("submensaje");

            const aceptar =
                document.getElementById("acepto");

            const gato =
                document.getElementById("gato");

            let indice =
                Math.min(
                    intentos,
                    mensajes.length - 1
                );

            pregunta.textContent =
                mensajes[indice];

            submensaje.textContent =
                submensajes[indice];

            boton.textContent = "✕ NO QUIERO";

            gato.classList.remove(
                "triste",
                "sorprendido",
                "molesto",
                "enojado",
                "furioso",
                "ataque",
                "acercarse"
            );


            if (intentos === 1) {
                gato.classList.add("triste");
            }

            else if (intentos === 2) {
                gato.classList.add("sorprendido");
            }

            else if (intentos === 3) {
                gato.classList.add("molesto");
            }

            else if (
                intentos >= 4 &&
                intentos <= 5
            ) {
                gato.classList.add("enojado");
            }

            else if (
                intentos >= 6 &&
                intentos < 10
            ) {
                gato.classList.add("furioso");
            }


            if (intentos === 6) {

                tarjeta.classList.add("rojo");

                document.body.classList.add(
                    "ambiente-rojo"
                );

                aceptar.classList.add(
                    "grande"
                );

                iniciarParticulasSangre();

            }


            if (false) {
                aceptar.textContent =
                    "✓ ACEPTA LESBIANA";
            }


            if (false) {
                aceptar.textContent =
                    "✓ YO SÉ QUE QUIERES IR";
            }


            if (false) {

                gato.classList.add("acercarse");

                pregunta.textContent =
                    "YA PUES, VAS A IR 😡";

                submensaje.textContent =
                    "¡DEJA DE DECIR QUE NO!";

                boton.textContent =
                    "✕ NO QUIERO";

            }


            if (false) {

                gato.classList.remove(
                    "furioso",
                    "acercarse"
                );

                gato.classList.add("ataque");

                tarjeta.classList.add(
                    "ataque-tarjeta"
                );

                pregunta.textContent =
                    "¡YA ME HICISTE ENOJAR! 😡";

                submensaje.textContent =
                    "¡AHORA SÍ TE VOY A ARAÑAR!";

                boton.textContent =
                    "✕ NO QUIERO";

                document
                    .getElementById("arañazos")
                    .classList.add("mostrar");

            }


            tarjeta.classList.remove(
                "temblar"
            );

            void tarjeta.offsetWidth;

            tarjeta.classList.add(
                "temblar"
            );

        }


        let intervaloParticulas = null;

        function crearParticulaSangre() {

            const contenedor =
                document.getElementById(
                    "particulasSangre"
                );

            if (!contenedor) return;

            const particula =
                document.createElement("span");

            particula.className =
                "particula-sangre";

            particula.style.left =
                (Math.random() * 100) + "%";

            particula.style.setProperty(
                "--duracion",
                (3.2 + Math.random() * 2.8) + "s"
            );

            particula.style.setProperty(
                "--retraso",
                (Math.random() * .35) + "s"
            );

            particula.style.setProperty(
                "--tamano",
                (2 + Math.random() * 5) + "px"
            );

            particula.style.setProperty(
                "--movimiento",
                ((Math.random() * 140) - 70) + "px"
            );

            particula.style.setProperty(
                "--giro",
                ((Math.random() * 720) - 360) + "deg"
            );

            contenedor.appendChild(particula);

            setTimeout(
                () => particula.remove(),
                7000
            );

        }


        function iniciarParticulasSangre() {

            if (intervaloParticulas) return;

            for (
                let i = 0;
                i < 24;
                i++
            ) {

                setTimeout(
                    crearParticulaSangre,
                    i * 100
                );

            }

            intervaloParticulas =
                setInterval(
                    crearParticulaSangre,
                    180
                );

        }


        function aceptar() {

            window.location.href =
                "fotos.html";

            return;


            const tarjeta =
                document.getElementById(
                    "tarjeta"
                );

            tarjeta.innerHTML = `

                <div class="borde-superior"></div>

                <div class="aceptado">

                    <div class="check">
                        ✓
                    </div>

                    <h1>
                        ¡ACEPTASTE!
                    </h1>

                    <div class="linea-final"></div>

                    <p>
                        Sabía que ibas a aceptar,
                        renegona 😌
                    </p>

                    <strong>
                        NOS VEMOS EN EL CINE
                    </strong>

                    <span>
                        16 DE DICIEMBRE · MALLANGAMOS
                    </span>

                    <button
                        onclick="location.reload()">

                        VOLVER

                    </button>

                </div>

            `;

        }
