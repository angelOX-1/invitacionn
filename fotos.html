        /* =====================================================
           VENTANA DE EDICIÓN
           ===================================================== */

        .editor-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 9999;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 25px;
            box-sizing: border-box;
        }

        .editor-overlay.mostrar {
            display: flex;
        }


        .editor-ventana {
            width: min(850px, 94vw);
            max-height: 90vh;
            overflow-y: auto;

            background: #171317;
            border: 1px solid rgba(180, 40, 70, .45);
            border-radius: 16px;

            box-shadow:
                0 25px 80px rgba(0,0,0,.75),
                0 0 40px rgba(125,29,53,.15);

            padding: 25px;

            position: relative;

            animation:
                aparecerEditor
                .3s
                ease
                forwards;
        }


        @keyframes aparecerEditor {

            from {
                opacity: 0;
                transform: translateY(25px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        .editor-cerrar {
            position: absolute;

            top: 12px;
            right: 15px;

            width: 36px;
            height: 36px;

            border: none;
            border-radius: 50%;

            background: rgba(255,255,255,.08);
            color: white;

            font-size: 25px;
            line-height: 1;

            cursor: pointer;

            z-index: 5;

            transition: .25s ease;
        }


        .editor-cerrar:hover {
            background: #7d1d35;
            transform: rotate(90deg);
        }


        .editor-titulo-principal {
            color: white;
            font-size: 22px;
            margin: 0 45px 20px 0;
        }


        .editor-titulo-principal span {
            color: #9e2947;
        }


        /* =====================================================
           PREVISUALIZACIÓN
           ===================================================== */

        .editor-preview {
            width: 100%;
            height: 330px;

            background: #090909;

            border-radius: 10px;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 22px;

            border: 1px solid rgba(255,255,255,.08);
        }


        .editor-preview img,
        .editor-preview video {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }


        /* =====================================================
           CAMPOS
           ===================================================== */

        .editor-campo {
            margin-bottom: 17px;
        }


        .editor-campo label {
            display: block;

            color: #ddd;

            font-size: 11px;
            font-weight: bold;

            margin-bottom: 7px;

            text-transform: uppercase;
            letter-spacing: 1px;
        }


        .editor-campo input,
        .editor-campo textarea {

            width: 100%;
            box-sizing: border-box;

            background: #0e0e0e;

            border: 1px solid #333;

            border-radius: 8px;

            color: white;

            padding: 12px 13px;

            font-family: inherit;

            font-size: 12px;

            outline: none;

            transition: .25s ease;
        }


        .editor-campo input:focus,
        .editor-campo textarea:focus {

            border-color: #8b2038;

            box-shadow:
                0 0 0 2px rgba(139,32,56,.15);

        }


        .editor-campo textarea {

            min-height: 100px;

            resize: vertical;

        }


        /* =====================================================
           BOTONES DEL EDITOR
           ===================================================== */

        .editor-botones {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 5px;
        }


        .editor-botones button {

            border: none;

            border-radius: 7px;

            padding: 10px 18px;

            font-size: 11px;

            cursor: pointer;

            transition: .25s ease;
        }


        .editor-cancelar {

            background: #333;

            color: white;
        }


        .editor-cancelar:hover {

            background: #444;

        }


        .editor-guardar {

            background: #7d1d35;

            color: white;

        }


        .editor-guardar:hover {

            background: #a12648;

            transform: translateY(-1px);

        }


        /* =====================================================
           BOTÓN EDITAR EN CADA TARJETA
           ===================================================== */

        .boton-editar {

            border: none;

            background: #7d1d35;

            color: white;

            border-radius: 5px;

            padding: 6px 9px;

            font-size: 9px;

            cursor: pointer;

            transition: .25s ease;

            white-space: nowrap;
        }


        .boton-editar:hover {

            background: #a12648;

            transform: scale(1.05);

        }


        .descripcion-contenido {

            flex: 1;

            min-width: 0;

        }


        /* =====================================================
           AVISO DE GUARDADO
           ===================================================== */

        .editor-guardado {

            position: fixed;

            left: 50%;

            bottom: 25px;

            transform: translateX(-50%);

            z-index: 10001;

            background: #7d1d35;

            color: white;

            padding: 10px 18px;

            border-radius: 7px;

            font-size: 11px;

            opacity: 0;

            pointer-events: none;

            transition: .3s ease;
        }


        .editor-guardado.mostrar {

            opacity: 1;

        }


        /* =====================================================
           MÓVIL
           ===================================================== */

        @media (max-width: 600px) {

            .editor-overlay {

                padding: 12px;

            }


            .editor-ventana {

                padding: 18px;

                width: 96vw;

            }


            .editor-preview {

                height: 250px;

            }


            .editor-botones {

                flex-direction: column;

            }


            .editor-botones button {

                width: 100%;

            }

        }

    </style>

                    "WhatsApp Image 2026-10-06 at 8.40.11 AM (1).jpeg",
                    "WhatsApp Image 2026-10-06 at 8.40.11 AM.jpeg",
                    "WhatsApp Image 2026-10-06 at 8.40.51 AM.jpeg",
                    "WhatsApp Image 2026-10-06 at 8.40.51 AMa.jpeg",
                    "WhatsApp Image 2026-10-06 at 8.40.53 AM.jpeg",
                    "WhatsApp Image 2026-10-06 at 8.42.08 AM.jpeg",
                    "WhatsApp Image 2026-10-06 at 8.42.09 AM.jpeg",
                    "WhatsApp Image 2026-10-06 at 8.42.29 AM.jpeg",
                    "WhatsApp Image 2026-10-06 at 8.44.21 AM.jpeg",
                    "WhatsApp Image 2026-10-06 at 8.44.22 AM.jpeg",
                    "WhatsApp Image 2026-10-06 at 8.44.29 AM.jpeg",

                    "WhatsApp Video 2026-10-06 at 8.42.08 AM.mp4"

                ]

            }

        };


        /* =====================================================
           DATOS GUARDADOS
           ===================================================== */

        const STORAGE_KEY =
            "mandarino_recuerdos_textos";


        let editorCategoria = null;

        let editorArchivo = null;


        function obtenerTodosLosTextos() {

            try {

                return JSON.parse(
                    localStorage.getItem(STORAGE_KEY)
                ) || {};

            } catch (error) {

                return {};

            }

        }


        function obtenerTexto(
            categoria,
            archivo
        ) {

            const todos =
                obtenerTodosLosTextos();


            const clave =
                categoria + "::" + archivo;


            if (todos[clave]) {

                return todos[clave];

            }


            return {

                titulo: "Momento especial",

                descripcion:
                    "Un recuerdo para guardar."

            };

        }


        function guardarTexto(
            categoria,
            archivo,
            titulo,
            descripcion
        ) {

            const todos =
                obtenerTodosLosTextos();


            const clave =
                categoria + "::" + archivo;


            todos[clave] = {

                titulo: titulo,

                descripcion: descripcion

            };


            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(todos)
            );

        }


        /* =====================================================
           RUTA
           ===================================================== */

        function rutaArchivo(
            carpeta,
            archivo
        ) {

            return "fotos/" +
                carpeta +
                "/" +
                encodeURIComponent(archivo)
                    .replace(/%2F/g, "/");

        }


        /* =====================================================
           CARGAR GALERÍA
           ===================================================== */

        function cargarGaleria(nombre) {

            const datos =
                categorias[nombre];


            const contenedor =
                document.getElementById(
                    "galeria-contenido"
                );


            let html = `

                <section
                    class="galeria activa"
                    id="galeria-${nombre}">

                    <div class="titulo-seccion">

                        <span class="numero">
                            ${datos.numero}
                        </span>

                        <div>

                            <h2>
                                ${datos.titulo}
                            </h2>

                            <p>
                                ${datos.descripcion}
                            </p>

                        </div>

                    </div>


                    <div class="galeria-grid">

            `;


            datos.archivos.forEach(
                function(
                    archivo,
                    indice
                ) {


                    const ruta =
                        rutaArchivo(
                            datos.carpeta,
                            archivo
                        );


                    const esVideo =
                        archivo
                            .toLowerCase()
                            .endsWith(".mp4");


                    const texto =
                        obtenerTexto(
                            nombre,
                            archivo
                        );


                    const tituloSeguro =
                        escaparHTML(
                            texto.titulo
                        );


                    const descripcionSegura =
                        escaparHTML(
                            texto.descripcion
                        );


                    if (esVideo) {

                        html += `

                            <article
                                class="foto-card"
                                data-categoria="${nombre}"
                                data-archivo="${escaparHTML(archivo)}">


                                <div
                                    class="foto video-card"
                                    onclick="abrirVideo('${escaparJS(ruta)}')">


                                    <video
                                        src="${ruta}"
                                        muted
                                        loop
                                        playsinline
                                        preload="metadata"
                                        onmouseenter="this.play()"
                                        onmouseleave="this.pause()">
                                    </video>


                                    <div class="brillo"></div>


                                    <div class="ver">

                                        <span>▶</span>

                                        Ver video

                                    </div>


                                    <div class="etiqueta-video">
                                        VIDEO
                                    </div>


                                </div>


                                <div class="descripcion">


                                    <div class="descripcion-contenido">

                                        <h3 class="tarjeta-titulo">
                                            ${tituloSeguro}
                                        </h3>


                                        <p class="tarjeta-descripcion">
                                            ${descripcionSegura}
                                        </p>

                                    </div>


                                    <button
                                        class="boton-editar"
                                        onclick="abrirEditor(event, '${escaparJS(nombre)}', '${escaparJS(archivo)}')">

                                        ✏️ Editar

                                    </button>


                                </div>


                            </article>

                        `;

                    } else {

                        html += `

                            <article
                                class="foto-card"
                                data-categoria="${nombre}"
                                data-archivo="${escaparHTML(archivo)}">


                                <div
                                    class="foto"
                                    onclick="abrirFoto('${escaparJS(ruta)}')">


                                    <img
                                        src="${ruta}"
                                        alt="${tituloSeguro}"
                                        loading="lazy">


                                    <div class="brillo"></div>


                                    <div class="ver">

                                        <span>+</span>

                                        Ver foto

                                    </div>


                                </div>


                                <div class="descripcion">


                                    <div class="descripcion-contenido">

                                        <h3 class="tarjeta-titulo">
                                            ${tituloSeguro}
                                        </h3>


                                        <p class="tarjeta-descripcion">
                                            ${descripcionSegura}
                                        </p>

                                    </div>


                                    <button
                                        class="boton-editar"
                                        onclick="abrirEditor(event, '${escaparJS(nombre)}', '${escaparJS(archivo)}')">

                                        ✏️ Editar

                                    </button>


                                </div>


                            </article>

                        `;

                    }

                }
            );


            html += `

                    </div>

                </section>

            `;


            contenedor.innerHTML =
                html;

        }


        /* =====================================================
           ESCAPAR HTML
           ===================================================== */

        function escaparHTML(texto) {

            return String(texto)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =====================================================
           ESCAPAR JAVASCRIPT
           ===================================================== */

        function escaparJS(texto) {

            return String(texto)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/\r/g, "\\r")
                .replace(/\n/g, "\\n");

        }


        /* =====================================================
           CAMBIAR CATEGORÍA
           ===================================================== */

        function mostrarCategoria(
            nombre,
            boton
        ) {

            cargarGaleria(nombre);


            document
                .querySelectorAll(".categoria")
                .forEach(
                    function(btn) {

                        btn.classList.remove(
                            "activa"
                        );

                    }
                );


            document
                .querySelectorAll(
                    ".dashboard-menu button"
                )
                .forEach(
                    function(btn) {

                        btn.classList.remove(
                            "activo"
                        );

                    }
                );


            if (boton) {

                boton.classList.add(
                    "activa"
                );

                boton.classList.add(
                    "activo"
                );

            }

        }


        /* =====================================================
           ABRIR EDITOR
           ===================================================== */

        function abrirEditor(
            event,
            categoria,
            archivo
        ) {

            event.preventDefault();

            event.stopPropagation();


            editorCategoria =
                categoria;


            editorArchivo =
                archivo;


            const texto =
                obtenerTexto(
                    categoria,
                    archivo
                );


            document.getElementById(
                "editorTitulo"
            ).value =
                texto.titulo;


            document.getElementById(
                "editorDescripcion"
            ).value =
                texto.descripcion;


            const datos =
                categorias[categoria];


            const ruta =
                rutaArchivo(
                    datos.carpeta,
                    archivo
                );


            const preview =
                document.getElementById(
                    "editorPreview"
                );


            const esVideo =
                archivo
                    .toLowerCase()
                    .endsWith(".mp4");


            if (esVideo) {

                preview.innerHTML = `

                    <video
                        src="${ruta}"
                        controls
                        autoplay
                        muted>
                    </video>

                `;

            } else {

                preview.innerHTML = `

                    <img
                        src="${ruta}"
                        alt="Vista previa">

                `;

            }


            document
                .getElementById(
                    "editorOverlay"
                )
                .classList.add(
                    "mostrar"
                );


            document.body.classList.add(
                "sin-scroll"
            );


            setTimeout(
                function() {

                    document
                        .getElementById(
                            "editorTitulo"
                        )
                        .focus();

                },
                100
            );

        }


        /* =====================================================
           GUARDAR EDICIÓN
           ===================================================== */

        function guardarEdicion() {

            if (
                !editorCategoria ||
                !editorArchivo
            ) {

                return;

            }


            let titulo =
                document
                    .getElementById(
                        "editorTitulo"
                    )
                    .value
                    .trim();


            let descripcion =
                document
                    .getElementById(
                        "editorDescripcion"
                    )
                    .value
                    .trim();


            if (!titulo) {

                titulo =
                    "Momento especial";

            }


            if (!descripcion) {

                descripcion =
                    "Un recuerdo para guardar.";

            }


            guardarTexto(
                editorCategoria,
                editorArchivo,
                titulo,
                descripcion
            );


            cerrarEditor();


            /* Recargar la categoría */

            cargarGaleria(
                editorCategoria
            );


            mostrarAvisoGuardado();

        }


        /* =====================================================
           CERRAR EDITOR
           ===================================================== */

        function cerrarEditor() {

            const overlay =
                document.getElementById(
                    "editorOverlay"
                );


            overlay.classList.remove(
                "mostrar"
            );


            document.body.classList.remove(
                "sin-scroll"
            );


            document.getElementById(
                "editorPreview"
            ).innerHTML = "";


            editorCategoria = null;

            editorArchivo = null;

        }


        /* =====================================================
           AVISO
           ===================================================== */

        function mostrarAvisoGuardado() {

            const aviso =
                document.getElementById(
                    "editorGuardado"
                );


            aviso.classList.add(
                "mostrar"
            );


            setTimeout(
                function() {

                    aviso.classList.remove(
                        "mostrar"
                    );

                },
                1800
            );

        }


        /* =====================================================
           ABRIR FOTO
           ===================================================== */

        function abrirFoto(ruta) {

            const visor =
                document.getElementById(
                    "visor"
                );


            const imagen =
                document.getElementById(
                    "imagenGrande"
                );


            const video =
                document.getElementById(
                    "videoGrande"
                );


            imagen.style.display =
                "block";


            video.style.display =
                "none";


            video.pause();

            video.src = "";


            imagen.src =
                ruta;


            visor.classList.add(
                "mostrar"
            );


            document.body.classList.add(
                "sin-scroll"
            );

        }


        /* =====================================================
           ABRIR VIDEO
           ===================================================== */

        function abrirVideo(ruta) {

            const visor =
                document.getElementById(
                    "visor"
                );


            const imagen =
                document.getElementById(
                    "imagenGrande"
                );


            const video =
                document.getElementById(
                    "videoGrande"
                );


            imagen.style.display =
                "none";


            imagen.src = "";


            video.style.display =
                "block";


            video.src =
                ruta;


            video.currentTime = 0;


            visor.classList.add(
                "mostrar"
            );


            document.body.classList.add(
                "sin-scroll"
            );


            video.play().catch(
                function() {}
            );

        }


        /* =====================================================
           CERRAR FOTO
           ===================================================== */

        function cerrarFoto() {

            const visor =
                document.getElementById(
                    "visor"
                );


            const imagen =
                document.getElementById(
                    "imagenGrande"
                );


            const video =
                document.getElementById(
                    "videoGrande"
                );


            visor.classList.remove(
                "mostrar"
            );


            imagen.src = "";


            video.pause();

            video.src = "";


            document.body.classList.remove(
                "sin-scroll"
            );

        }


        /* =====================================================
           CERRAR EDITOR CON ESCAPE
           ===================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    const editor =
                        document.getElementById(
                            "editorOverlay"
                        );


                    if (
                        editor.classList.contains(
                            "mostrar"
                        )
                    ) {

                        cerrarEditor();

                        return;

                    }


                    cerrarFoto();

                }

            }
        );


        /* =====================================================
           CERRAR EDITOR AL HACER CLICK FUERA
           ===================================================== */

        document
            .getElementById(
                "editorOverlay"
            )
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target === this
                    ) {

                        cerrarEditor();

                    }

                }
            );


        /* =====================================================
           CERRAR VISOR AL HACER CLICK FUERA
           ===================================================== */

        document
            .getElementById(
                "visor"
            )
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target === this
                    ) {

                        cerrarFoto();

                    }

                }
            );


        /* =====================================================
           MOUSE SOBRE TARJETAS
           ===================================================== */

        document.addEventListener(
            "mousemove",
            function(event) {

                const tarjeta =
                    event.target.closest(
                        ".foto-card"
                    );


                if (!tarjeta) {
                    return;
                }


                const rect =
                    tarjeta.getBoundingClientRect();


                tarjeta.style.setProperty(
                    "--mouse-x",
                    (event.clientX - rect.left) + "px"
                );


                tarjeta.style.setProperty(
                    "--mouse-y",
                    (event.clientY - rect.top) + "px"
                );

            }
        );


        /* =====================================================
           CARGAR AL INICIAR
           ===================================================== */

        cargarGaleria(
            "juegos"
        );


    </script>

</body>
